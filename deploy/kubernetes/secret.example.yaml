# The keys the Deployment reads. Not part of kustomization.yaml: create the Secret with your own
# tooling (a secrets operator, sealed secrets, or kubectl create secret) and never commit real values.
#
#   kubectl create secret generic mesh-hub \
#     --from-literal=db-url='postgres://mesh:CHANGE-ME@postgres.example.internal:5432/mesh?sslmode=require' \
#     --from-literal=oidc-client-secret='CHANGE-ME'
apiVersion: v1
kind: Secret
metadata:
  name: mesh-hub
  labels:
    app.kubernetes.io/name: mesh-hub
type: Opaque
stringData:
  db-url: postgres://mesh:CHANGE-ME@postgres.example.internal:5432/mesh?sslmode=require
  oidc-client-secret: CHANGE-ME
