name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - name: Install tmux
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then sudo apt-get update && sudo apt-get install -y tmux; else brew install tmux; fi
          tmux -V
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm boundaries
      - run: pnpm test
      - run: pnpm build

  # The store contract suite against Postgres (M4.6). The other jobs run it on SQLite only.
  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: mesh
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    env:
      MESH_TEST_PG_URL: postgres://postgres:mesh@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec vitest run src/store test/m46-replicas.test.ts test/m46-ops.test.ts

  # The hub image (Dockerfile): built and started once, not published.
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: docker build -t mesh-hub:ci .
      - name: Smoke test (one replica on SQLite)
        run: |
          docker run -d --name hub -p 7700:7700 -e MESH_HUB_DB=/data/mesh-hub.db -e MESH_HUB_CONFIG=/tmp/mesh-hub.yaml \
            --entrypoint sh mesh-hub:ci -c 'node dist/main.mjs hub init --config /tmp/mesh-hub.yaml --users ci >/dev/null && exec node dist/main.mjs hub'
          for i in $(seq 30); do curl -fsS http://127.0.0.1:7700/readyz && break; sleep 1; done
          curl -fsS http://127.0.0.1:7700/readyz
          curl -fsS http://127.0.0.1:7700/healthz
          docker stop -t 10 hub
          test "$(docker inspect hub --format '{{.State.ExitCode}}')" = 0
      - if: failure()
        run: docker logs hub || true

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:web
